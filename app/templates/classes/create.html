{% extends "base.html" %}

{% block title %}Create Class - Study App{% endblock %}

{% block content %}
<div class="relative w-full max-w-md mx-auto min-h-screen bg-[#E8E9E8] flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10">
        <a href="{{ url_for('main.dashboard') }}" class="text-slate-900 flex size-12 shrink-0 items-center justify-center cursor-pointer">
            <span class="material-symbols-outlined text-[24px]">arrow_back_ios</span>
        </a>
        <h2 class="text-slate-900 text-[24px] font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
            Create Class
        </h2>
    </header>

    <form method="POST" class="flex flex-col flex-1 px-6">
        <div class="h-6"></div>
        <div class="space-y-6">
            <!-- Class Name -->
            <div class="flex flex-col gap-2">
                <label class="flex flex-col">
                    <p class="text-slate-900 text-sm font-semibold uppercase tracking-wider pb-2">Class Name</p>
                    <input name="name" required
                        class="w-full rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-black border border-slate-300 bg-white h-14 placeholder:text-slate-400 p-4 text-lg font-mono tracking-widest"
                        placeholder="e.g. Advanced Biology - Period 3" type="text" />
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="mt-auto pb-10 pt-8">
            <button type="submit"
                class="w-full rounded-xl h-14 bg-black text-white text-lg font-bold shadow-md hover:opacity-90 transition-opacity">
                Create Class
            </button>
        </div>
    </form>
</div>
{% endblock %}
